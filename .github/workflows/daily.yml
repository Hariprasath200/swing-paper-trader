name: daily-scan
on:
  schedule:
    # GitHub cron is UTC. IST = UTC + 5:30. Mon-Fri only.
    - cron: "50 3 * * 1-5"     # 09:20 IST  update positions
    - cron: "30 4-10 * * 1-5"  # 10:00 to 16:00 IST hourly (16:00 also runs the full scan)
    - cron: "30 11 * * 1-5"    # 17:00 IST backup if the 16:00 scan failed (harmless if already done)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: swinglab
  cancel-in-progress: false    # runs queue one after another so they never clash on the database
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_daily.py
      - name: Save results back to the repo
        run: |
          git config user.name "swinglab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add paper_v2.db universe_cache.csv
          git commit -m "update $(TZ=Asia/Kolkata date +'%F %H:%M IST')" || echo "nothing to commit"
          git pull --rebase origin main
          git push
