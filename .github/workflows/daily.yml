name: daily-scan
on:
  schedule:
    # GitHub cron is UTC. IST = UTC + 5:30. Mon-Fri only.
    # Runs avoid the top of the hour, when GitHub is busiest and drops scheduled jobs most often.
    - cron: "50 3 * * 1-5"     # 09:20 IST  update positions
    - cron: "37 4-10 * * 1-5"  # 10:07 to 16:07 IST hourly (16:07 also runs the full scan)
    - cron: "7 5-11 * * 1-5"   # 10:37 to 17:07 IST second chance each hour; skips itself if the first run worked
    - cron: "30 11 * * 1-5"    # 17:00 IST final backup for the daily scan
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: swinglab
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_daily.py
      - name: Save results back to the repo
        run: |
          git config user.name "swinglab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add paper_v2.db universe_cache.csv
          git commit -m "update $(TZ=Asia/Kolkata date +'%F %H:%M IST')" || echo "nothing to commit"
          git pull --rebase origin main
          git push
