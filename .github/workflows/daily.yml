name: daily-scan
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 PM IST (11:30 UTC), Monday to Friday
  workflow_dispatch:           # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_daily.py
      - name: Save results back to the repo
        run: |
          git config user.name "swinglab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add paper_v2.db universe_cache.csv
          git commit -m "daily scan $(date -u +%F)" || echo "nothing to commit"
          git push
